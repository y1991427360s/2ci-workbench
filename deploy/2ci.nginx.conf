limit_req_zone $binary_remote_addr zone=2ci_login:10m rate=5r/m;
server {
    listen 127.0.0.1:9529 ssl;
    server_name 2ci.sen666.com;
    ssl_certificate /etc/letsencrypt/live/2ci.sen666.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2ci.sen666.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80m;
    location = /api/login {
        limit_req zone=2ci_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8029;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:8029;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
